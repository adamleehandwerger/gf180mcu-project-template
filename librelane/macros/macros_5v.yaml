  # 5V SRAM
  gf180mcu_fd_ip_sram__sram512x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram512x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram512x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram512x8m8wm1__blackbox_pp.v
    lib:
      "*_tt_025C_5v00":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ff_n40C_5v50.lib
      "*_ss_125C_4v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ss_125C_4v50.lib
    instances:
      # 6 SRAM macros total (NUM_SV=600, the accuracy optimum):
      #   rows 1-2 = alpha_sram_1024x16 (u_alpha): 2 banks x 2 byte lanes =
      #              u0lo/u0hi (bank 0) + u1lo/u1hi (bank 1) as a 2x2 block
      #   row 3    = feature_sram_512x16 (u_feat): 1 bank x 2 byte lanes = ulo/uhi
      # 2-wide x 3-tall stack at the core bottom. Cols X=500/980 (macro w=431.86,
      # ~48um gap); rows Y=700/1250/1800 (macro h=484.88, ~65um gap). Core
      # X442..1494, Y442..4680. Also referenced in pdn/pdn_5v_sram.tcl.
      i_chip_core.u_core.u_alpha.u0lo:
        location: [500, 700]
        orientation: N
      i_chip_core.u_core.u_alpha.u0hi:
        location: [980, 700]
        orientation: N
      i_chip_core.u_core.u_alpha.u1lo:
        location: [500, 1250]
        orientation: N
      i_chip_core.u_core.u_alpha.u1hi:
        location: [980, 1250]
        orientation: N
      i_chip_core.u_core.u_feat.ulo:
        location: [500, 1800]
        orientation: N
      i_chip_core.u_core.u_feat.uhi:
        location: [980, 1800]
        orientation: N

# This is an alternative method compared to
# specifying the power connections in the RTL
PDN_MACRO_CONNECTIONS:
- "i_chip_core.u_core.u_alpha.u0lo VDD VSS VDD VSS"
- "i_chip_core.u_core.u_alpha.u0hi VDD VSS VDD VSS"
- "i_chip_core.u_core.u_alpha.u1lo VDD VSS VDD VSS"
- "i_chip_core.u_core.u_alpha.u1hi VDD VSS VDD VSS"
- "i_chip_core.u_core.u_feat.ulo VDD VSS VDD VSS"
- "i_chip_core.u_core.u_feat.uhi VDD VSS VDD VSS"
